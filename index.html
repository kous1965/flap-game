<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>フラップ飛行</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4ec0ca;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  }
  #score {
    margin-top: 16px;
    font-size: 48px;
    font-weight: 700;
  }
  #message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  #message h1 {
    font-size: 28px;
    margin: 0 0 8px;
  }
  #message p {
    font-size: 16px;
    margin: 0;
    opacity: 0.9;
  }
  #best {
    font-size: 14px;
    opacity: 0.85;
    margin-top: 4px;
  }
  #mute-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.25);
    color: #fff;
    font-size: 20px;
    line-height: 44px;
    text-align: center;
    padding: 0;
    z-index: 10;
  }
  #history-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 64px);
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.25);
    color: #fff;
    font-size: 20px;
    line-height: 44px;
    text-align: center;
    padding: 0;
    z-index: 10;
  }
  #buffs {
    margin-top: 6px;
    font-size: 14px;
    min-height: 18px;
  }
  #share-btn {
    display: none;
    margin-top: 14px;
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.92);
    color: #1c5f96;
    font-weight: 700;
    font-size: 14px;
    pointer-events: auto;
  }
  #history-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 20;
    align-items: center;
    justify-content: center;
  }
  #history-card {
    background: #fff;
    color: #1c3b6b;
    width: min(320px, 84vw);
    max-height: 70vh;
    border-radius: 16px;
    padding: 18px;
    overflow-y: auto;
    text-shadow: none;
  }
  #history-card h2 {
    margin: 0 0 12px;
    font-size: 18px;
    text-align: center;
  }
  #history-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #history-list li {
    display: flex;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  .history-empty {
    text-align: center;
    color: #888;
    justify-content: center !important;
  }
  .history-score {
    font-weight: 700;
  }
  .history-date {
    color: #888;
  }
  #history-close {
    display: block;
    margin: 14px auto 0;
    padding: 8px 20px;
    border: none;
    border-radius: 16px;
    background: #1c5f96;
    color: #fff;
    font-size: 14px;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <button id="mute-btn" aria-label="サウンド切り替え">🔊</button>
  <button id="history-btn" aria-label="履歴">📜</button>
  <div id="hud">
    <div id="score">0</div>
    <div id="best"></div>
    <div id="buffs"></div>
  </div>
  <div id="message">
    <h1>タップでスタート</h1>
    <p>画面をタップして飛び続けよう</p>
    <button id="share-btn">結果をシェア</button>
  </div>
  <div id="history-panel">
    <div id="history-card">
      <h2>最近のスコア</h2>
      <ul id="history-list"></ul>
      <button id="history-close">閉じる</button>
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const buffsEl = document.getElementById('buffs');
  const messageEl = document.getElementById('message');
  const shareBtn = document.getElementById('share-btn');
  const historyBtn = document.getElementById('history-btn');
  const historyPanel = document.getElementById('history-panel');
  const historyCloseBtn = document.getElementById('history-close');
  const historyListEl = document.getElementById('history-list');

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W, H;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const BEST_KEY = 'flap-best-score';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  bestEl.textContent = 'ベスト: ' + best;

  const AudioEngine = (() => {
    let ctx = null;
    let masterGain = null;
    let musicGain = null;
    let sfxGain = null;
    let muted = false;
    let musicTimer = null;
    let next16thTime = 0;
    let step = 0;
    const bpm = 124;
    const stepDur = 60 / bpm / 4;

    // YMO(テクノポリス/ライディーン)的な高速アルペジオをオマージュした自作フレーズ
    const arpNotes = [220.00, 261.63, 329.63, 392.00, 440.00, 392.00, 329.63, 261.63];
    const bassNotes = [110.00, null, null, null, 110.00, null, 130.81, null,
                        110.00, null, null, null, 98.00, null, null, null];

    function ensure() {
      if (ctx) {
        if (ctx.state === 'suspended') ctx.resume();
        return;
      }
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = 0.7;
      masterGain.connect(ctx.destination);

      musicGain = ctx.createGain();
      musicGain.gain.value = 0.22;
      musicGain.connect(masterGain);

      sfxGain = ctx.createGain();
      sfxGain.gain.value = 0.9;
      sfxGain.connect(masterGain);

      if (ctx.state === 'suspended') ctx.resume();
      // iOSは無音バッファを一度再生しないと出力が完全に起きないことがあるための保険
      const unlockBuffer = ctx.createBuffer(1, 1, 22050);
      const unlockSource = ctx.createBufferSource();
      unlockSource.buffer = unlockBuffer;
      unlockSource.connect(ctx.destination);
      unlockSource.start(0);
    }

    function tone(freq, startTime, duration, type, gainNode, peak) {
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      env.gain.setValueAtTime(0, startTime);
      env.gain.linearRampToValueAtTime(peak, startTime + 0.008);
      env.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      osc.connect(env);
      env.connect(gainNode);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.02);
    }

    function noiseBurst(startTime, duration, peak, gainNode) {
      const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 6000;
      const env = ctx.createGain();
      env.gain.setValueAtTime(peak, startTime);
      env.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      src.connect(filter);
      filter.connect(env);
      env.connect(gainNode);
      src.start(startTime);
      src.stop(startTime + duration);
    }

    function scheduleStep(time) {
      const arpFreq = arpNotes[step % arpNotes.length];
      tone(arpFreq, time, stepDur * 0.9, 'square', musicGain, 0.5);

      const bassFreq = bassNotes[step % bassNotes.length];
      if (bassFreq) {
        tone(bassFreq, time, stepDur * 3.5, 'triangle', musicGain, 0.9);
      }

      if (step % 2 === 0) {
        noiseBurst(time, 0.03, 0.15, musicGain);
      }
      step++;
    }

    function schedulerLoop() {
      while (next16thTime < ctx.currentTime + 0.12) {
        scheduleStep(next16thTime);
        next16thTime += stepDur;
      }
    }

    function startMusic() {
      if (!ctx || musicTimer) return;
      step = 0;
      next16thTime = ctx.currentTime + 0.05;
      schedulerLoop();
      musicTimer = setInterval(schedulerLoop, 25);
    }

    function playFlap() {
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(320, t);
      osc.frequency.exponentialRampToValueAtTime(680, t + 0.09);
      env.gain.setValueAtTime(0.0001, t);
      env.gain.linearRampToValueAtTime(0.6, t + 0.01);
      env.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
      osc.connect(env);
      env.connect(sfxGain);
      osc.start(t);
      osc.stop(t + 0.13);
    }

    function playScore(pitch) {
      if (!ctx) return;
      const p = pitch || 1;
      const t = ctx.currentTime;
      tone(660 * p, t, 0.09, 'square', sfxGain, 0.5);
      tone(990 * p, t + 0.07, 0.12, 'square', sfxGain, 0.5);
    }

    function playItem() {
      if (!ctx) return;
      const t = ctx.currentTime;
      tone(523.25, t, 0.1, 'square', sfxGain, 0.45);
      tone(659.25, t + 0.06, 0.1, 'square', sfxGain, 0.45);
      tone(783.99, t + 0.12, 0.16, 'square', sfxGain, 0.5);
    }

    function playDie() {
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, t);
      osc.frequency.exponentialRampToValueAtTime(60, t + 0.4);
      env.gain.setValueAtTime(0.5, t);
      env.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      osc.connect(env);
      env.connect(sfxGain);
      osc.start(t);
      osc.stop(t + 0.46);
    }

    function playFall() {
      if (!ctx) return;
      const t = ctx.currentTime;
      const duration = 0.3;
      const bufferSize = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2200, t);
      filter.frequency.exponentialRampToValueAtTime(250, t + duration);
      const env = ctx.createGain();
      env.gain.setValueAtTime(0.32, t);
      env.gain.exponentialRampToValueAtTime(0.0001, t + duration + 0.02);
      src.connect(filter);
      filter.connect(env);
      env.connect(sfxGain);
      src.start(t);
      src.stop(t + duration + 0.03);
    }

    function toggleMute() {
      ensure();
      muted = !muted;
      masterGain.gain.setTargetAtTime(muted ? 0 : 0.7, ctx.currentTime, 0.01);
      return muted;
    }

    return { ensure, startMusic, playFlap, playScore, playItem, playDie, playFall, toggleMute };
  })();

  const muteBtn = document.getElementById('mute-btn');
  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isMuted = AudioEngine.toggleMute();
    muteBtn.textContent = isMuted ? '🔇' : '🔊';
  });

  const HISTORY_KEY = 'flap-history';
  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    } catch (e) {
      return [];
    }
  }
  function pushHistory(finalScore) {
    const history = loadHistory();
    history.unshift({ score: finalScore, date: new Date().toISOString() });
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 10)));
  }
  function formatHistoryDate(iso) {
    const d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function renderHistory() {
    const history = loadHistory();
    historyListEl.innerHTML = '';
    if (history.length === 0) {
      const li = document.createElement('li');
      li.textContent = 'まだ記録がありません';
      li.className = 'history-empty';
      historyListEl.appendChild(li);
      return;
    }
    history.forEach((entry) => {
      const li = document.createElement('li');
      const scoreSpan = document.createElement('span');
      scoreSpan.className = 'history-score';
      scoreSpan.textContent = entry.score + '点';
      const dateSpan = document.createElement('span');
      dateSpan.className = 'history-date';
      dateSpan.textContent = formatHistoryDate(entry.date);
      li.appendChild(scoreSpan);
      li.appendChild(dateSpan);
      historyListEl.appendChild(li);
    });
  }
  historyBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    renderHistory();
    historyPanel.style.display = 'flex';
  });
  historyCloseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    historyPanel.style.display = 'none';
  });
  historyPanel.addEventListener('click', (e) => {
    if (e.target === historyPanel) historyPanel.style.display = 'none';
  });

  shareBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const text = 'ダック・フラップでスコア ' + score + ' 点!';
    if (navigator.share) {
      try {
        await navigator.share({ title: 'ダック・フラップ', text, url: location.href });
      } catch (err) {
        // ユーザーがキャンセルした場合は何もしない
      }
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(text + ' ' + location.href);
      shareBtn.textContent = 'コピーしました';
      setTimeout(() => { shareBtn.textContent = '結果をシェア'; }, 1500);
    }
  });

  const GRAVITY = 1500;
  const FLAP_VELOCITY = -430;
  const PIPE_GAP = 190;
  const PIPE_WIDTH = 70;
  const PIPE_SPACING = 260;
  const PIPE_SPEED = 160;
  const BIRD_X_RATIO = 0.3;
  const BIRD_RADIUS = 16;
  const ITEM_RADIUS = 14;
  const INVINCIBLE_DURATION = 5;
  const SCORE_BOOST_DURATION = 6;

  let state = 'ready'; // ready | playing | dead
  let bird, pipes, items, score, groundOffset, elapsedSinceStart;
  let invincibleTimer, scoreBoostTimer, comboPopup;
  let skyTime = 0;

  function resetGame() {
    bird = {
      y: H * 0.4,
      vy: 0,
      rotation: 0,
      wingAngle: 0,
      wingSpread: 0,
      flapPhase: 0
    };
    pipes = [];
    items = [];
    score = 0;
    groundOffset = 0;
    elapsedSinceStart = 0;
    invincibleTimer = 0;
    scoreBoostTimer = 0;
    comboPopup = null;
    scoreEl.textContent = '0';
    shareBtn.style.display = 'none';
    updateBuffHud();
    let x = W + 100;
    for (let i = 0; i < 5; i++) {
      pipes.push(makePipe(x));
      x += PIPE_SPACING;
    }
  }

  function makePipe(x) {
    const margin = 80;
    const gapCenter = margin + Math.random() * (H - margin * 2 - 120);
    const moving = Math.random() < 0.3;
    const pipe = {
      x,
      gapCenter,
      baseGapCenter: gapCenter,
      passed: false,
      moving,
      moveAmplitude: moving ? 35 + Math.random() * 35 : 0,
      moveSpeed: moving ? 0.8 + Math.random() * 0.7 : 0,
      movePhase: Math.random() * Math.PI * 2
    };
    if (!moving && Math.random() < 0.3) {
      const type = Math.random() < 0.5 ? 'star' : 'coin';
      items.push({ x: x + PIPE_WIDTH / 2, y: gapCenter, type, collected: false });
    }
    return pipe;
  }

  function flap() {
    if (state === 'ready') {
      AudioEngine.ensure();
      AudioEngine.startMusic();
      state = 'playing';
      messageEl.style.display = 'none';
      bird.vy = FLAP_VELOCITY;
      AudioEngine.playFlap();
    } else if (state === 'playing') {
      bird.vy = FLAP_VELOCITY;
      AudioEngine.playFlap();
    } else if (state === 'dead') {
      resetGame();
      state = 'ready';
      messageEl.querySelector('h1').textContent = 'タップでスタート';
      messageEl.querySelector('p').textContent = '画面をタップして飛び続けよう';
      messageEl.style.display = 'block';
    }
  }

  function onPointerDown(e) {
    e.preventDefault();
    flap();
  }
  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  canvas.addEventListener('mousedown', onPointerDown);

  function update(dt) {
    groundOffset += PIPE_SPEED * dt;
    skyTime += dt;
    if (comboPopup) {
      comboPopup.timer -= dt;
      if (comboPopup.timer <= 0) comboPopup = null;
    }

    if (state !== 'playing') return;

    elapsedSinceStart += dt;
    invincibleTimer = Math.max(0, invincibleTimer - dt);
    scoreBoostTimer = Math.max(0, scoreBoostTimer - dt);
    const wasRising = bird.vy < 0;
    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.rotation = Math.max(-0.5, Math.min(1.2, bird.vy / 600));

    const isRising = bird.vy < 0;
    if (wasRising && !isRising) {
      AudioEngine.playFall();
    }
    if (isRising) {
      bird.flapPhase += dt * 24;
      bird.wingAngle = Math.sin(bird.flapPhase) * 0.85;
      bird.wingSpread += (1 - bird.wingSpread) * Math.min(1, dt * 14);
    } else {
      bird.flapPhase = 0;
      bird.wingAngle += (0.15 - bird.wingAngle) * Math.min(1, dt * 10);
      bird.wingSpread += (0.18 - bird.wingSpread) * Math.min(1, dt * 8);
    }

    const groundY = H - 40;
    if (bird.y + BIRD_RADIUS > groundY) {
      bird.y = groundY - BIRD_RADIUS;
      die();
    }
    if (bird.y - BIRD_RADIUS < 0) {
      bird.y = BIRD_RADIUS;
      bird.vy = 0;
    }

    const birdX = W * BIRD_X_RATIO;

    for (const pipe of pipes) {
      pipe.x -= PIPE_SPEED * dt;

      if (pipe.moving) {
        const raw = pipe.baseGapCenter + Math.sin(elapsedSinceStart * pipe.moveSpeed + pipe.movePhase) * pipe.moveAmplitude;
        const minCenter = PIPE_GAP / 2 + 30;
        const maxCenter = groundY - PIPE_GAP / 2 - 30;
        pipe.gapCenter = Math.max(minCenter, Math.min(maxCenter, raw));
      }

      if (!pipe.passed && pipe.x + PIPE_WIDTH < birdX) {
        pipe.passed = true;
        const gained = scoreBoostTimer > 0 ? 2 : 1;
        score += gained;
        scoreEl.textContent = String(score);
        AudioEngine.playScore(1 + Math.min(score, 20) * 0.025);
        if (score % 5 === 0) {
          comboPopup = { text: score + ' COMBO!', timer: 1.1, maxTimer: 1.1 };
        }
      }

      const withinX = birdX + BIRD_RADIUS > pipe.x && birdX - BIRD_RADIUS < pipe.x + PIPE_WIDTH;
      if (withinX && invincibleTimer <= 0) {
        const gapTop = pipe.gapCenter - PIPE_GAP / 2;
        const gapBottom = pipe.gapCenter + PIPE_GAP / 2;
        if (bird.y - BIRD_RADIUS < gapTop || bird.y + BIRD_RADIUS > gapBottom) {
          die();
        }
      }
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const item = items[i];
      item.x -= PIPE_SPEED * dt;
      if (item.x < -30) {
        items.splice(i, 1);
        continue;
      }
      const dx = item.x - birdX;
      const dy = item.y - bird.y;
      if (Math.hypot(dx, dy) < ITEM_RADIUS + BIRD_RADIUS * 0.9) {
        items.splice(i, 1);
        AudioEngine.playItem();
        if (item.type === 'star') {
          invincibleTimer = INVINCIBLE_DURATION;
        } else {
          scoreBoostTimer = SCORE_BOOST_DURATION;
        }
        updateBuffHud();
      }
    }

    if (pipes.length && pipes[0].x + PIPE_WIDTH < -20) {
      pipes.shift();
      const lastX = pipes[pipes.length - 1].x;
      pipes.push(makePipe(lastX + PIPE_SPACING));
    }

    updateBuffHud();
  }

  function updateBuffHud() {
    const parts = [];
    if (invincibleTimer > 0) parts.push('⭐無敵 ' + invincibleTimer.toFixed(1) + 's');
    if (scoreBoostTimer > 0) parts.push('💰2倍 ' + scoreBoostTimer.toFixed(1) + 's');
    buffsEl.textContent = parts.join('   ');
  }

  function die() {
    if (state !== 'playing') return;
    state = 'dead';
    AudioEngine.playDie();
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    bestEl.textContent = 'ベスト: ' + best;
    pushHistory(score);
    messageEl.querySelector('h1').textContent = 'ゲームオーバー';
    messageEl.querySelector('p').textContent = 'スコア ' + score + ' ・ タップでリトライ';
    messageEl.style.display = 'block';
    shareBtn.style.display = 'inline-block';
  }

  const CYCLE_SECONDS = 45;
  const SKY_STOPS = [
    { top: [255, 179, 133], bottom: [255, 225, 194] }, // 朝焼け
    { top: [78, 192, 202], bottom: [143, 224, 230] },  // 昼
    { top: [255, 126, 95], bottom: [254, 180, 123] },  // 夕焼け
    { top: [11, 26, 58], bottom: [28, 59, 107] }       // 夜
  ];
  const STAR_FIELD = Array.from({ length: 40 }, () => ({
    x: Math.random(),
    y: Math.random() * 0.6,
    r: 0.6 + Math.random() * 1.2,
    tw: Math.random() * Math.PI * 2
  }));

  function lerpNum(a, b, t) { return a + (b - a) * t; }
  function mixColor(a, b, t) {
    return [
      Math.round(lerpNum(a[0], b[0], t)),
      Math.round(lerpNum(a[1], b[1], t)),
      Math.round(lerpNum(a[2], b[2], t))
    ];
  }
  function rgbCss(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

  function getSky(time) {
    const n = SKY_STOPS.length;
    const cyclePos = (time % CYCLE_SECONDS) / CYCLE_SECONDS;
    const scaled = cyclePos * n;
    const i0 = Math.floor(scaled) % n;
    const i1 = (i0 + 1) % n;
    const t = scaled - Math.floor(scaled);
    const top = mixColor(SKY_STOPS[i0].top, SKY_STOPS[i1].top, t);
    const bottom = mixColor(SKY_STOPS[i0].bottom, SKY_STOPS[i1].bottom, t);
    const nightFactor = Math.max(0, Math.pow(Math.cos((cyclePos - 0.75) * Math.PI * 2), 3));
    return { top, bottom, nightFactor };
  }

  function drawBackground() {
    const sky = getSky(skyTime);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, rgbCss(sky.top));
    grad.addColorStop(1, rgbCss(sky.bottom));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    if (sky.nightFactor > 0.02) {
      for (const star of STAR_FIELD) {
        const twinkle = 0.5 + 0.5 * Math.sin(skyTime * 2 + star.tw);
        ctx.globalAlpha = sky.nightFactor * twinkle;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(star.x * W, star.y * H, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  let brickPatternCache = null;
  function getBrickPattern() {
    if (brickPatternCache) return brickPatternCache;
    const bw = 24, bh = 14, gap = 2;
    const tile = document.createElement('canvas');
    tile.width = bw * 2;
    tile.height = bh * 2;
    const tctx = tile.getContext('2d');

    tctx.fillStyle = '#e3cda3';
    tctx.fillRect(0, 0, tile.width, tile.height);

    tctx.fillStyle = '#c1502f';
    tctx.strokeStyle = '#8f3720';
    tctx.lineWidth = 1;
    const drawBrick = (x, y, w, h) => {
      tctx.fillRect(x, y, w, h);
      tctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    };

    // row A (aligned)
    drawBrick(gap, gap, bw - gap * 2, bh - gap * 2);
    drawBrick(bw + gap, gap, bw - gap * 2, bh - gap * 2);
    // row B (offset half a brick for a running-bond pattern, wrapped at the tile edges)
    drawBrick(0, bh + gap, bw / 2 - gap, bh - gap * 2);
    drawBrick(bw / 2 + gap, bh + gap, bw - gap * 2, bh - gap * 2);
    drawBrick(bw * 1.5 + gap, bh + gap, bw / 2 - gap, bh - gap * 2);

    brickPatternCache = ctx.createPattern(tile, 'repeat');
    return brickPatternCache;
  }

  function drawPipes() {
    const pattern = getBrickPattern();
    ctx.strokeStyle = '#6e2c1a';
    ctx.lineWidth = 3;
    for (const pipe of pipes) {
      const gapTop = pipe.gapCenter - PIPE_GAP / 2;
      const gapBottom = pipe.gapCenter + PIPE_GAP / 2;

      ctx.save();
      ctx.translate(pipe.x, 0);
      ctx.fillStyle = pattern;
      ctx.fillRect(0, 0, PIPE_WIDTH, gapTop);
      ctx.fillRect(0, gapBottom, PIPE_WIDTH, H - gapBottom);
      ctx.restore();

      ctx.strokeRect(pipe.x, 0, PIPE_WIDTH, gapTop);
      ctx.strokeRect(pipe.x, gapBottom, PIPE_WIDTH, H - gapBottom);
    }
  }

  function drawStarShape(cx, cy, outerR, innerR, points, fill, stroke) {
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const angle = (Math.PI / points) * i - Math.PI / 2;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  function drawItems() {
    for (const item of items) {
      const bob = Math.sin(skyTime * 4 + item.x * 0.05) * 3;
      ctx.save();
      ctx.translate(item.x, item.y + bob);
      if (item.type === 'star') {
        drawStarShape(0, 0, ITEM_RADIUS, ITEM_RADIUS * 0.45, 5, '#ffe066', '#e0a800');
      } else {
        ctx.fillStyle = '#ffd447';
        ctx.strokeStyle = '#c98f14';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, ITEM_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#a5690a';
        ctx.font = 'bold 14px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('2x', 0, 1);
      }
      ctx.restore();
    }
  }

  function drawComboPopup() {
    if (!comboPopup || comboPopup.timer <= 0) return;
    const t = comboPopup.timer / comboPopup.maxTimer;
    const alpha = Math.min(1, t * 1.5);
    const riseOffset = (1 - t) * 30;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 4;
    ctx.font = 'bold 30px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText(comboPopup.text, W / 2, H * 0.3 - riseOffset);
    ctx.fillText(comboPopup.text, W / 2, H * 0.3 - riseOffset);
    ctx.restore();
  }

  function waveY(x, groundY, phase) {
    const t = x + phase;
    return groundY
      + Math.sin(t * 0.045) * 4.5
      + Math.sin(t * 0.11 + 1.3) * 2.5
      + Math.sin(t * 0.021 + 2.7) * 3.5;
  }

  function drawGround() {
    const groundY = H - 40;

    const grad = ctx.createLinearGradient(0, groundY, 0, H);
    grad.addColorStop(0, '#3aa8dd');
    grad.addColorStop(1, '#1c5f96');
    ctx.fillStyle = grad;
    ctx.fillRect(0, groundY, W, 40);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 4) {
      ctx.lineTo(x, waveY(x, groundY, groundOffset));
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 4) {
      const y = waveY(x, groundY, groundOffset);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = 1;
    for (let row = 1; row <= 2; row++) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 6) {
        const y = waveY(x, groundY, groundOffset * (0.6 + row * 0.15) + row * 90) + row * 11;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  function drawBird() {
    const birdX = W * BIRD_X_RATIO;
    ctx.save();
    ctx.translate(birdX, bird.y);
    ctx.rotate(bird.rotation);

    if (invincibleTimer > 0) {
      const pulse = 0.6 + 0.4 * Math.sin(skyTime * 10);
      ctx.save();
      ctx.globalAlpha = 0.35 * pulse;
      ctx.fillStyle = '#7fe8ff';
      ctx.beginPath();
      ctx.arc(0, 0, BIRD_RADIUS * 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // rubber-duck-style tail/wing bump at the back
    ctx.fillStyle = '#f5c02e';
    ctx.beginPath();
    ctx.ellipse(-BIRD_RADIUS * 0.75, -BIRD_RADIUS * 0.1, BIRD_RADIUS * 0.55, BIRD_RADIUS * 0.65, 0, 0, Math.PI * 2);
    ctx.fill();

    // body, facing right
    ctx.fillStyle = '#ffd23f';
    ctx.strokeStyle = '#e0a800';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_RADIUS * 1.15, BIRD_RADIUS, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // wing: flaps open while rising, folds flat against the body while falling
    ctx.save();
    ctx.translate(-BIRD_RADIUS * 0.05, -BIRD_RADIUS * 0.05);
    ctx.rotate(bird.wingAngle);
    const wingLen = BIRD_RADIUS * (0.6 + bird.wingSpread * 0.6);
    const wingWid = BIRD_RADIUS * (0.3 + bird.wingSpread * 0.12);
    ctx.fillStyle = '#f0b429';
    ctx.strokeStyle = '#c98f14';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(-wingLen * 0.25, 0, wingLen, wingWid, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // rounded beak pointing right
    ctx.fillStyle = '#ff7a1a';
    ctx.strokeStyle = '#d9600a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(BIRD_RADIUS * 0.55, -BIRD_RADIUS * 0.35);
    ctx.quadraticCurveTo(BIRD_RADIUS * 1.7, -BIRD_RADIUS * 0.3, BIRD_RADIUS * 1.6, BIRD_RADIUS * 0.05);
    ctx.quadraticCurveTo(BIRD_RADIUS * 1.5, BIRD_RADIUS * 0.35, BIRD_RADIUS * 0.5, BIRD_RADIUS * 0.15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // big duck eye, upper-right of the head
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(BIRD_RADIUS * 0.35, -BIRD_RADIUS * 0.35, BIRD_RADIUS * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(BIRD_RADIUS * 0.45, -BIRD_RADIUS * 0.32, BIRD_RADIUS * 0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function draw() {
    drawBackground();
    drawPipes();
    drawItems();
    drawGround();
    drawBird();
    drawComboPopup();
  }

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - lastTime) / 1000));
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
